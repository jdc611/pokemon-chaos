name: Build Playtest ROM

"on":
  push:
    branches:
      - chaos-firered
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/workflows/apply-*.yml"
      - ".github/scripts/**"
  workflow_dispatch: {}

env:
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1
  PLAYTEST_TRIGGER: "Native FireRed Feasibility Audit v2"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout FireRed port branch
        uses: actions/checkout@v4
        with:
          ref: chaos-firered

      - name: Apply source migration
        run: python3 .github/scripts/apply_stat_colors_levelcap_exp.py

      - name: Commit migrated source changes
        run: |
          if ! git diff --quiet -- src/battle_controller_player.c src/battle_script_commands.c src/debug.c; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/battle_controller_player.c src/battle_script_commands.c src/debug.c
            git commit -m "Implement remaining status UI and EXP fixes"
            git push origin HEAD:chaos-firered
          fi

      - name: Materialize approved Chaos title artwork
        run: python3 .github/scripts/materialize_chaos_title.py

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Check Kanto progression and party preservation
        run: |
          python3 .github/scripts/check_chaos_kanto.py
          python3 .github/scripts/check_chaos_gym_reset.py
          python3 .github/scripts/check_chaos_respawn.py
          python3 .github/scripts/check_chaos_party_exit.py
          python3 .github/scripts/check_chaos_early_pool.py
          python3 .github/scripts/check_chaos_field.py
          python3 .github/scripts/check_chaos_mega.py
          python3 .github/scripts/check_chaos_shortcuts.py
          python3 .github/scripts/check_chaos_randomizer.py
          python3 .github/scripts/check_chaos_starter_ability.py
          python3 .github/scripts/check_chaos_abilities.py
          python3 .github/scripts/check_chaos_ranch.py

      - name: Build native FireRed target
        run: |
          set -o pipefail
          make firered -k -j$(nproc) -O 2>&1 | tee build.log

      - name: Surface build errors
        if: failure()
        run: |
          echo "### Compiler errors" >> "$GITHUB_STEP_SUMMARY"
          grep -nE '(^|: )(fatal error|error:|undefined reference|multiple definition|redefinition|make(\[[0-9]+\])?: \*\*\*)' build.log | tail -300 | tee errors.txt || true
          while IFS= read -r line; do
            safe=${line//'%'/'%25'}
            safe=${safe//$'\r'/'%0D'}
            safe=${safe//$'\n'/'%0A'}
            echo "::error::$safe"
          done < errors.txt

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: build.log

      - name: Upload Playtest ROM
        uses: actions/upload-artifact@v4
        with:
          name: Chaos-FireRed-Audit-${{ github.sha }}
          path: pokefirered.gba

      - name: Upload emulator verification symbols
        uses: actions/upload-artifact@v4
        with:
          name: Chaos-QA-symbols-${{ github.sha }}
          path: |
            pokefirered.elf
            pokefirered.map
