name: Build Playtest ROM

"on":
  push:
    branches:
      - master
      - chaos-firered
      - chaos-v3
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/workflows/apply-*.yml"
      - ".github/scripts/**"
  workflow_dispatch: {}

env:
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1
  PLAYTEST_TRIGGER: "Unified FireRed IronMON playtest"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout the requested playtest revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Apply source migration
        run: python3 .github/scripts/apply_stat_colors_levelcap_exp.py

      - name: Commit migrated source changes
        if: github.ref_name == 'chaos-firered'
        run: |
          if ! git diff --quiet -- src/battle_controller_player.c src/battle_script_commands.c src/debug.c; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/battle_controller_player.c src/battle_script_commands.c src/debug.c
            git commit -m "Implement remaining status UI and EXP fixes"
            git push origin HEAD:chaos-firered
          fi

      - name: Materialize approved Chaos title artwork
        run: python3 .github/scripts/materialize_chaos_title.py

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3 python3-pil

      - name: Check Kanto progression and party preservation
        run: |
          python3 .github/scripts/check_chaos_kanto.py
          python3 .github/scripts/check_chaos_gym_reset.py
          python3 .github/scripts/check_chaos_respawn.py
          python3 .github/scripts/check_chaos_party_exit.py
          python3 .github/scripts/check_chaos_early_pool.py
          python3 .github/scripts/check_chaos_field.py
          python3 .github/scripts/check_chaos_mega.py
          python3 .github/scripts/check_chaos_alpha.py
          python3 tools/chaos/check_bst.py
          python3 .github/scripts/check_chaos_shortcuts.py
          python3 .github/scripts/check_chaos_randomizer.py
          python3 .github/scripts/check_chaos_arcade.py
          python3 .github/scripts/check_chaos_arcade_prizes.py
          python3 .github/scripts/check_chaos_arcade_items.py
          python3 .github/scripts/check_chaos_arcade_games.py
          python3 .github/scripts/check_chaos_arcade_phase5.py
          python3 .github/scripts/check_chaos_arcade_phase6.py
          python3 .github/scripts/check_chaos_starter_ability.py
          python3 .github/scripts/check_chaos_abilities.py
          python3 .github/scripts/check_chaos_ranch.py
          python3 .github/scripts/check_chaos_stabilization.py

      - name: Build native FireRed target
        run: |
          set -o pipefail
          make firered -k -j$(nproc) -O 2>&1 | tee build.log

      - name: Record ROM provenance
        run: |
          echo "Source: ${{ github.repository }}@${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          sha256sum pokefirered.gba >> "$GITHUB_STEP_SUMMARY"

      - name: Surface build errors
        if: failure()
        run: |
          echo "### Compiler errors" >> "$GITHUB_STEP_SUMMARY"
          grep -nE '(^|: )(fatal error|error:|undefined reference|multiple definition|redefinition|make(\[[0-9]+\])?: \*\*\*)' build.log | tail -300 | tee errors.txt || true
          while IFS= read -r line; do
            safe=${line//'%'/'%25'}
            safe=${safe//$'\r'/'%0D'}
            safe=${safe//$'\n'/'%0A'}
            echo "::error::$safe"
          done < errors.txt

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: build.log

      - name: Upload Playtest ROM
        uses: actions/upload-artifact@v4
        with:
          name: Chaos-FireRed-${{ github.ref_name }}-Playtest-${{ github.run_number }}-${{ github.sha }}
          path: pokefirered.gba

      - name: Build and validate Delta tracker skin
        run: python3 tools/chaos/delta/build_skin.py --output delta-skin

      - name: Upload Delta tracker skin
        uses: actions/upload-artifact@v4
        with:
          name: Chaos-Delta-Tracker-${{ github.run_number }}
          path: delta-skin/Pokemon-Chaos-Tracker.deltaskin
